<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(to right, #ff6b6b, #ffb347);
        }

        .login-container{
            background:white;
            padding:40px;
            width:350px;
            border-radius:20px;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        .login-container h2{
            color:#ff5722;
            margin-bottom:25px;
            font-size:30px;
        }

        .input-box{
            width:100%;
            padding:14px;
            margin:12px 0;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }

        .input-box:focus{
            border-color:#ff5722;
        }

        .login-btn{
            width:100%;
            padding:14px;
            background:#ff5722;
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        .login-btn:hover{
            background:#e64a19;
            transform:scale(1.05);
        }

        .icon{
            font-size:55px;
            margin-bottom:15px;
        }

        .register-link{
            margin-top:15px;
            display:block;
            color:#555;
            text-decoration:none;
        }

        .register-link:hover{
            color:#ff5722;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="icon">🍔</div>

        <h2>User Login</h2>

        <form action="../login.php" method="POST">

            <input type="email" 
                   name="email" 
                   placeholder="Enter Email"
                   class="input-box"
                   required>

            <input type="password" 
                   name="password" 
                   placeholder="Enter Password"
                   class="input-box"
                   required>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <a href="register.html" class="register-link">
            Don't have an account? Register
        </a>

    </div>

</body>
</html>
