<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering System</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            background: linear-gradient(to right, #ff6b6b, #ffb347);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            width:400px;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        h1{
            color:#ff5722;
            margin-bottom:15px;
            font-size:32px;
        }

        p{
            color:#555;
            margin-bottom:30px;
            font-size:16px;
        }

        .btn{
            display:block;
            width:100%;
            text-decoration:none;
            background:#ff5722;
            color:white;
            padding:14px;
            margin:12px 0;
            border-radius:10px;
            font-size:18px;
            transition:0.3s;
        }

        .btn:hover{
            background:#e64a19;
            transform:scale(1.05);
        }

        .food-icon{
            font-size:60px;
            margin-bottom:20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="food-icon">🍔🍕🍟</div>

        <h1>Food Ordering System</h1>

        <p>Order your favorite food online quickly and easily.</p>

        <a href="login.html" class="btn">Login</a>

        <a href="register.html" class="btn">Register</a>

        <a href="menu.html" class="btn">View Menu</a>

    </div>

</body>
</html>
